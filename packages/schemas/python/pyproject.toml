[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paax-schemas"
version = "0.1.0"
description = "Shared Python taxonomy and schema helpers for PAAX services"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paax_schemas*"]
